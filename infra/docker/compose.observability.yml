services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_IMAGE_TAG:-0.123.0}
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - observability
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG:-v3.2.1}
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-19090}:9090"
    networks:
      - observability
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-11.5.2}
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-13000}:3000"
    networks:
      - observability
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus_data:
    name: ${PROMETHEUS_VOLUME_NAME:-nexlabs_company_prometheus}
  grafana_data:
    name: ${GRAFANA_VOLUME_NAME:-nexlabs_company_grafana}

secrets:
  grafana_admin_password:
    file: ${NEXLABS_SECRET_DIR:-./secrets/local}/grafana_admin_password.txt

name: Bootstrap GEF 1.1.2

on:
  push:
    branches:
      - chore/NXL-COMPANY-001-gef-bootstrap-1.1.2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install exact GEF release
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts @gef-bootstrap/cli@1.1.2
          version="$(gef --version)"
          printf '%s\n' "$version" | tee "$RUNNER_TEMP/gef-version.txt"
          case "$version" in
            *1.1.2*) ;;
            *) echo "Expected GEF 1.1.2, got: $version" >&2; exit 1 ;;
          esac
          gef --help > "$RUNNER_TEMP/gef-help.txt"

      - name: Preview governed initialization
        shell: bash
        run: |
          set -euo pipefail
          gef init --target "$GITHUB_WORKSPACE" --json | tee "$RUNNER_TEMP/gef-init-plan.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/gef-init-plan.json','utf8'))"

      - name: Apply governed initialization
        shell: bash
        run: |
          set -euo pipefail
          gef init --target "$GITHUB_WORKSPACE" --apply --json | tee "$RUNNER_TEMP/gef-init-apply.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/gef-init-apply.json','utf8'))"

      - name: Commit GEF managed state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "GEF init produced no repository changes." >&2
            exit 1
          fi
          git commit -m "chore: initialize GEF Bootstrap v1.1.2"

      - name: Validate initialized state
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/gef-validation"
          gef doctor --target "$GITHUB_WORKSPACE" --json > "$RUNNER_TEMP/gef-validation/doctor.json"
          doctor_exit=$?
          gef status --target "$GITHUB_WORKSPACE" --json > "$RUNNER_TEMP/gef-validation/status.json"
          status_exit=$?
          set -e
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/gef-validation/doctor.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/gef-validation/status.json','utf8'))"
          printf '%s\n' "$doctor_exit" > "$RUNNER_TEMP/gef-validation/doctor.exit"
          printf '%s\n' "$status_exit" > "$RUNNER_TEMP/gef-validation/status.exit"
          echo "doctor_exit=$doctor_exit"
          echo "status_exit=$status_exit"

      - name: Persist bootstrap evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence=".engineering/evidence/NXL-COMPANY-GEF-BOOTSTRAP-001"
          mkdir -p "$evidence"
          cp "$RUNNER_TEMP/gef-version.txt" "$evidence/gef-version.txt"
          cp "$RUNNER_TEMP/gef-init-plan.json" "$evidence/init-plan.json"
          cp "$RUNNER_TEMP/gef-init-apply.json" "$evidence/init-apply.json"
          cp "$RUNNER_TEMP/gef-validation/doctor.json" "$evidence/doctor.json"
          cp "$RUNNER_TEMP/gef-validation/status.json" "$evidence/status.json"
          cp "$RUNNER_TEMP/gef-validation/doctor.exit" "$evidence/doctor.exit"
          cp "$RUNNER_TEMP/gef-validation/status.exit" "$evidence/status.exit"
          printf '%s\n' "$(git rev-parse HEAD)" > "$evidence/initialized-head.txt"
          git add "$evidence"
          git commit -m "docs: record GEF 1.1.2 bootstrap evidence"

      - name: Push initialized branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git push origin "HEAD:$TARGET_BRANCH"

name: Validate NexLabs Governance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical governance model
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');

          const required=[
            'company/CORPORATE-GOVERNANCE.md',
            'company/AUTHORITY-MATRIX.md',
            'company/RISK-CLASSIFICATION.md',
            'company/APPROVAL-POLICY.md',
            'company/SEGREGATION-OF-DUTIES.md',
            'company/ESCALATION-AND-INCIDENT-AUTHORITY.md',
            'company/PROHIBITED-ACTIONS.md',
            'company/AUDIT-AND-RECEIPTS.md'
          ];
          for(const p of required){
            if(!fs.existsSync(p)) throw new Error('Missing canonical governance file: '+p);
          }

          const gov=fs.readFileSync('company/CORPORATE-GOVERNANCE.md','utf8');
          const matrix=fs.readFileSync('company/AUTHORITY-MATRIX.md','utf8');
          const risk=fs.readFileSync('company/RISK-CLASSIFICATION.md','utf8');
          const approval=fs.readFileSync('company/APPROVAL-POLICY.md','utf8');
          const duties=fs.readFileSync('company/SEGREGATION-OF-DUTIES.md','utf8');
          const escalation=fs.readFileSync('company/ESCALATION-AND-INCIDENT-AUTHORITY.md','utf8');
          const prohibited=fs.readFileSync('company/PROHIBITED-ACTIONS.md','utf8');
          const audit=fs.readFileSync('company/AUDIT-AND-RECEIPTS.md','utf8');

          for(const cls of ['AUTO','AUTO+AUDIT','REVIEW_REQUIRED','CEO_APPROVAL','PROHIBITED']){
            if(!matrix.includes(cls)) throw new Error('Missing action class: '+cls);
          }
          for(const level of ['R0','R1','R2','R3','R4']){
            if(!risk.includes(level)) throw new Error('Missing risk class: '+level);
          }
          for(const term of ['funds','credential','legal','signing']){
            if(!matrix.toLowerCase().includes(term)) throw new Error('Missing high-risk authority category: '+term);
          }
          if(!gov.includes('Default deny')) throw new Error('Default-deny governance missing');
          if(!gov.includes('No self-expansion')) throw new Error('Self-expansion prohibition missing');
          if(!duties.includes('High-risk self-approval prohibition')) throw new Error('High-risk self-approval control missing');
          if(!approval.includes('Capability and authority are distinct')) throw new Error('Capability/authority separation missing');
          if(!escalation.includes('No timeout-to-approval')) throw new Error('Timeout-to-approval guard missing');
          for(const marker of ['grant itself new permissions','unrestricted autonomous movement','force-push/history rewrite','fabricate a review']){
            if(!prohibited.includes(marker)) throw new Error('Missing prohibited-action marker: '+marker);
          }
          for(const state of ['SUCCEEDED','FAILED','BLOCKED','DENIED','RECOVERY_REQUIRED']){
            if(!audit.includes(state)) throw new Error('Missing audit outcome state: '+state);
          }

          const wo5=fs.readFileSync('.engineering/work-orders/NXL-COMPANY-WO-005.md','utf8');
          if(!wo5.includes('Status:** `APPROVED / MERGED`') &&
             !wo5.includes('Status:** `ADMITTED / IN_PROGRESS`')) {
            throw new Error('WO-005 governance authority is not in an accepted lifecycle state');
          }

          const combined=[gov,matrix,risk,approval,duties,escalation,prohibited,audit].join('\n').toLowerCase();
          if(combined.includes('silence means approval')) throw new Error('Implicit silence-as-approval detected');
          if(combined.includes('agent may grant itself')) throw new Error('Self-granting authority detected');

          console.log('Canonical NexLabs governance validation passed.');
          NODE
      - name: Validate versioned blocked audit lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node --check company-os/governance/blocked-audit-lifecycle.mjs
          node --check company-os/governance/blocked-audit-lifecycle.test.mjs
          node --test company-os/governance/blocked-audit-lifecycle.test.mjs

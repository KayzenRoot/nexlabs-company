name: Validate NexLabs v0.1 Integrated Acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preliminary-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: governance
          fetch-depth: 0
      - name: Checkout immutable WO-022 audit snapshot
        uses: actions/checkout@v4
        with:
          repository: KayzenRoot/nexlabs-company
          ref: 7a5e42b1e3bfd0736668279780ec13ae4f96e13b
          path: wo022-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate current governance blocked-audit lifecycle
        working-directory: governance
        run: |
          node --check company-os/governance/blocked-audit-lifecycle.mjs
          node --test company-os/governance/blocked-audit-lifecycle.test.mjs
      - name: Validate WO-022 source and authority
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const cp=JSON.parse(fs.readFileSync('.engineering/CHECKPOINT.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('.engineering/context-locks/NXL-COMPANY-WO-022.json','utf8'));
          const wo=fs.readFileSync('.engineering/work-orders/NXL-COMPANY-WO-022.md','utf8');
          const registry=fs.readFileSync('.engineering/WORK-ORDER-REGISTRY.md','utf8');
          if(cp.gefVersion!=='1.1.2'||cp.repositoryDisclosure!=='PUBLIC_SAFE_ONLY')throw Error('Changed governance baseline');
          if(lock.workOrderId!=='NXL-COMPANY-WO-022'||lock.issue!==23||
            lock.baseSha!=='d2f7acc85babd62cfacb87a4d061ef39e74a566d'||lock.state!=='LOCKED_FOR_WO_022')throw Error('Lock mismatch');
          if(cp.activeWorkOrder!=='NXL-COMPANY-WO-022'||cp.activeIssue!==23||
            cp.activeContextLock!=='.engineering/context-locks/NXL-COMPANY-WO-022.json')throw Error('Acceptance must remain explicitly active pending signoff');
          if(!wo.includes('ADMITTED / IN_PROGRESS')||!registry.includes('| NXL-COMPANY-WO-022 | #23 | ADMITTED / IN_PROGRESS |'))throw Error('WO or registry state conflict');
          if(cp.completedThroughWorkOrder!=='NXL-COMPANY-WO-023')throw Error('Prior remediation not completed');
          for(const [p,sha] of Object.entries(lock.sourceBlobFingerprints)){
            if(!fs.existsSync(p)||!/^[a-f0-9]{40}$/.test(sha))throw Error('Invalid source fingerprint '+p);
            const actual=execFileSync('git',['rev-parse',lock.baseSha+':'+p],{encoding:'utf8'}).trim();
            if(actual!==sha)throw Error('Source drift vs exact frozen base '+p);
          }
          console.log('WO-022 single admission/lock preflight accepted; no release authorization');
          NODE
        working-directory: wo022-audit
      - name: Run read-only integrated DoD evaluator
        run: |
          node --check company-os/acceptance/v01-audit.mjs
          node --check company-os/acceptance/v01-audit.test.mjs
          node --test company-os/acceptance/v01-audit.test.mjs
          node company-os/acceptance/v01-audit.mjs > /tmp/nexlabs-v01-preliminary.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('/tmp/nexlabs-v01-preliminary.json','utf8'));
          if(x.state!=='RELEASE_NOT_APPROVED'||x.fullDoDSatisfied!==false||
             x.founderApproval!=='PENDING'||x.unresolved.length<1)throw Error('Premature release authorization');
          console.log('Release remains gated, assessment complete');
          NODE
        working-directory: wo022-audit

      - name: Enforce read-only remediation governance preflight
        run: |
          node --check company-os/acceptance/remediation-preflight.mjs
          node --check company-os/acceptance/remediation-preflight.test.mjs
          node --test company-os/acceptance/remediation-preflight.test.mjs
          node --check company-os/acceptance/blocked-audit-handoff.mjs
          node --check company-os/acceptance/blocked-audit-handoff.test.mjs
          node --test company-os/acceptance/blocked-audit-handoff.test.mjs
          node --check company-os/acceptance/blocked-closeout-readiness.mjs
          node --check company-os/acceptance/blocked-closeout-readiness.test.mjs
          node --test company-os/acceptance/blocked-closeout-readiness.test.mjs
          echo 'Remediation remains PLANNED; WO-024 is NOT_ADMITTED and release remains BLOCKED'
        working-directory: wo022-audit

  secret-scan:
    name: Historical/PR secrets detection (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          ref: 7a5e42b1e3bfd0736668279780ec13ae4f96e13b
          fetch-depth: 0
      - name: Scan for repository secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.24.3"
      - name: Scan all fetched Git history (redacted)
        shell: bash
        run: |
          set -euo pipefail
          scanner="/tmp/gitleaks-8.24.3/gitleaks"
          if [ ! -x "$scanner" ]; then echo "Pinned Gitleaks binary unavailable"; exit 1; fi
          set +e
          "$scanner" git --log-opts="--all" --gitleaks-ignore-path=company-os/acceptance/.gitleaksignore --redact --exit-code=2 --report-format=json --report-path=/tmp/nxl-wo022-history.json .
          result=$?
          set -e
          if [ -s /tmp/nxl-wo022-history.json ]; then
            node <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/nxl-wo022-history.json','utf8'));
          const summary=new Map();
          for(const row of rows){
            const rule=String(row.RuleID||'unknown').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,65);
            const file=String(row.File||'unknown').replace(/[^a-zA-Z0-9./_-]/g,'_').slice(0,150);
            const key=rule+' :: '+file;
            summary.set(key,(summary.get(key)||0)+1);
          }
          console.log('WO-022 historical findings (metadata ONLY; no secrets):',JSON.stringify([...summary].map(([key,count])=>({key,count}))));
          console.log('WO-022 historical locations (NO secret values):',JSON.stringify(rows.map(row=>({
            line:Number(row.StartLine)||null,
            revision:/^[a-f0-9]{40}$/.test(String(row.Commit||''))?String(row.Commit).slice(0,12):'unknown',
            rule:String(row.RuleID||'unknown').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,65),
            file:String(row.File||'unknown').replace(/[^a-zA-Z0-9./_-]/g,'_').slice(0,150)
          }))));
          console.log('WO-022 total historical findings:',rows.length);
          NODE
          fi
          exit "$result"

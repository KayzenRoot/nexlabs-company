name: Validate NexLabs AI Employee Contract

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-employee-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical AI employee contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');

          const required=[
            'company/AI-EMPLOYEE-CONTRACT.md',
            'company/AI-ROLE-SCHEMA.md',
            'company/AI-PERMISSIONS-MODEL.md',
            'company/AI-MEMORY-POLICY.md',
            'company/AI-TOOLS-AND-CAPABILITIES.md',
            'company/AI-KPI-AND-EVALUATION.md',
            'company/AI-ESCALATION-CONTRACT.md',
            'company/AI-FAILURE-AND-REPLACEMENT.md',
            'company/AI-RUN-RECEIPT-CONTRACT.md'
          ];
          for(const p of required){
            if(!fs.existsSync(p)) throw new Error('Missing canonical employee-contract file: '+p);
          }

          const contract=fs.readFileSync('company/AI-EMPLOYEE-CONTRACT.md','utf8');
          const schema=fs.readFileSync('company/AI-ROLE-SCHEMA.md','utf8');
          const perm=fs.readFileSync('company/AI-PERMISSIONS-MODEL.md','utf8');
          const memory=fs.readFileSync('company/AI-MEMORY-POLICY.md','utf8');
          const tools=fs.readFileSync('company/AI-TOOLS-AND-CAPABILITIES.md','utf8');
          const kpi=fs.readFileSync('company/AI-KPI-AND-EVALUATION.md','utf8');
          const esc=fs.readFileSync('company/AI-ESCALATION-CONTRACT.md','utf8');
          const fail=fs.readFileSync('company/AI-FAILURE-AND-REPLACEMENT.md','utf8');
          const receipt=fs.readFileSync('company/AI-RUN-RECEIPT-CONTRACT.md','utf8');

          const fields=['role_id','contract_version','mission','responsibilities','inputs','outputs','tools','permissions','memory','kpis','escalation','limitations'];
          for(const f of fields){
            if(!contract.includes(f) || !schema.includes(f)) throw new Error('Missing contract/schema field: '+f);
          }
          if(!perm.includes('Default deny') || !perm.includes('Revocation') || !perm.includes('Expiry')) throw new Error('Permission safety incomplete');
          if(!memory.includes('canonical Checkpoint') || !memory.includes('conversation recall')) throw new Error('Memory precedence incomplete');
          if(!tools.includes('Tool ≠ authority')) throw new Error('Tool/authority boundary missing');
          if(!kpi.includes('Anti-metrics') || !kpi.includes('fabricated evidence')) throw new Error('KPI safety incomplete');
          for(const state of ['BLOCKED','DENIED','UNKNOWN','RECOVERY_REQUIRED','PROHIBITED']){
            if(!esc.includes(state)) throw new Error('Escalation state missing: '+state);
          }
          if(!fail.includes('Infinite retry loops are prohibited')) throw new Error('Bounded retry rule missing');
          for(const f of ['role_id','contract_version','runtime_provider','action_class','risk_class','outcome','evidence_refs']){
            if(!receipt.includes(f)) throw new Error('Run receipt field missing: '+f);
          }

          const wo7=fs.readFileSync('.engineering/work-orders/NXL-COMPANY-WO-007.md','utf8');
          if(!wo7.includes('Status:** `APPROVED / MERGED`') &&
             !wo7.includes('Status:** `ADMITTED / IN_PROGRESS`')) {
            throw new Error('WO-007 employee-contract authority is not in an accepted lifecycle state');
          }

          console.log('Canonical NexLabs AI employee contract validation passed.');
          NODE

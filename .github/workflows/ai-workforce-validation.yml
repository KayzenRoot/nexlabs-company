name: Validate NexLabs AI Workforce

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-workforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical AI workforce architecture
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const required=[
            'company/AI-ORGANIZATION.md',
            'company/AI-WORKFORCE-ARCHITECTURE.md',
            'company/EXECUTIVE-AGENTS.md',
            'company/ROLE-TAXONOMY.md',
            'company/TEAM-TOPOLOGY.md',
            'company/SOFTWARE-DELIVERY-CELL.md',
            'company/MINIMUM-VIABLE-WORKFORCE.md',
            'company/STAFFING-PHASES.md'
          ];
          for(const p of required){
            if(!fs.existsSync(p)) throw new Error('Missing canonical workforce file: '+p);
          }

          const org=fs.readFileSync('company/AI-ORGANIZATION.md','utf8');
          const arch=fs.readFileSync('company/AI-WORKFORCE-ARCHITECTURE.md','utf8');
          const exec=fs.readFileSync('company/EXECUTIVE-AGENTS.md','utf8');
          const roles=fs.readFileSync('company/ROLE-TAXONOMY.md','utf8');
          const cell=fs.readFileSync('company/SOFTWARE-DELIVERY-CELL.md','utf8');
          const min=fs.readFileSync('company/MINIMUM-VIABLE-WORKFORCE.md','utf8');
          const phases=fs.readFileSync('company/STAFFING-PHASES.md','utf8');

          for(const marker of ['Founder / CEO','AI Chief of Staff','AI Product & Strategy','AI Technology & Engineering']){
            if(!org.includes(marker)) throw new Error('Organization missing core role: '+marker);
          }
          for(const family of ['Product','Engineering','Research & Data','Security & Risk','Operations','Finance','Commercial']){
            if(!roles.includes(family)) throw new Error('Role taxonomy missing family: '+family);
          }
          for(const stage of ['Planner / Architect','Executor','QA / Test Engineer','Reviewer / Auditor']){
            if(!cell.includes(stage)) throw new Error('Software cell missing stage: '+stage);
          }
          if(!arch.toLowerCase().includes('elastic')) throw new Error('Elastic workforce principle missing');
          if(!min.includes('~3 persistent logical AI coordination capabilities')) throw new Error('Minimum viable workforce baseline missing');
          if(!phases.includes('Phase 0') || !phases.includes('Phase 4')) throw new Error('Staffing phases incomplete');

          const wo6=fs.readFileSync('.engineering/work-orders/NXL-COMPANY-WO-006.md','utf8');
          if(!wo6.includes('Status:** `APPROVED / MERGED`') &&
             !wo6.includes('Status:** `ADMITTED / IN_PROGRESS`')) {
            throw new Error('WO-006 workforce authority is not in an accepted lifecycle state');
          }

          console.log('Canonical NexLabs AI workforce validation passed.');
          NODE
